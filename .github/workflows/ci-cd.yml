name: CI/CD Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest


    steps:
    # 1. 저장소의 코드를 가상 환경으로 가져옴
    - uses: actions/checkout@v3

    # 2. 파이썬 3.11 환경 설치 및 설정
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    # 3. 필수 패키지 및 프로젝트 의존성 라이브러리 설치
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. 코드 스타일 및 문법 오류 검사 (Lint)
    - name: Lint with flake8
      run: |
        # 문법 에러나 정의되지 않은 이름이 있으면 빌드 중단
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # 나머지 스타일 규칙은 경고로 처리 (줄 길이 127자 제한)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics


  # Docker 빌드 테스트 잡 (Job)
  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    # Dockerfile을 이용해 이미지가 정상적으로 생성되는지 검증
    - name: Build Docker image
      run: |
        docker build . -t aigent-backend-api:latest

  # 실제 운영 서버 배포 잡 (Job)
  deploy:
    # 테스트와 빌드가 성공했을 때만 실행
    needs: [lint, docker-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Deploy to Remote Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: root
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        command_timeout: 30m
        script: |
          # 1. 기존 프로젝트 폴더 정기 삭제 전, 로그 폴더만 바깥으로 피신시키기 (mv)
          # 만약 기존 로그 폴더가 있다면 통째로 ~/backend_logs_tmp 로 이동
          mv ~/backend/app/logs ~/backend_logs_tmp 2>/dev/null || true

          # 2. 클린 배포를 위해 프로젝트 폴더 삭제
          rm -rf ~/backend

          # 3. 새로운 코드 다시 복제
          git clone https://${{ secrets.GH_TOKEN }}@github.com/News-Comparative-Analysis-Agent/backend.git

          # 4. GitHub Secrets에서 .env 파일 생성
          # ENV_FILE 시크릿에 .env 내용 전체를 넣어주세요.
          echo "${{ secrets.ENV_FILE }}" > ~/backend/.env

          # 5. 아까 꺼내놨던 로그 폴더를 원래 위치로 다시 밀어넣기 (진짜 폴더이므로 도커가 완벽하게 인식)
          mkdir -p ~/backend/app/logs
          mv ~/backend_logs_tmp/* ~/backend/app/logs/ 2>/dev/null || true
          rm -rf ~/backend_logs_tmp
          chmod -R 777 ~/backend/app/logs
          
          # 6. 서버 빌드 및 실행
          cd ~/backend
          docker compose up -d --build
          docker image prune -f
