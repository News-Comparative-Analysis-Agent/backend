name: Daily News Scraper and Clustering

on:
  schedule:
    # 한국 시간(KST) 기준 오전 06:00 -> UTC 기준 전날 오후 21:00
    - cron: '0 21 * * *'
    # 한국 시간(KST) 기준 오후 18:00 -> UTC 기준 오전 09:00
    - cron: '0 9 * * *'
  
  # 수동으로 버튼을 눌러서 실행할 수 있도록 허용
  workflow_dispatch:

jobs:
  scrape-and-cluster:
    runs-on: ubuntu-latest
    
    steps:
    - name: 저장소 코드 체크아웃 (가져오기)
      uses: actions/checkout@v4
      
    - name: 파이썬(Python) 3.11 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # 패키지 설치 속도 상승을 위한 캐시
        
    - name: 시스템 라이브러리 설치 (형태소 분석기 등 필요)
      run: |
        sudo apt-get update
        sudo apt-get install -y default-jdk # konlpy를 위한 JAVA 설치
        
    - name: 파이썬 패키지 설치 (requirements.txt 기준)
      run: |
        python -m pip install --upgrade pip
        # 의존성이 명시된 requirements가 있다면 아래 주석 해제하여 사용
        # pip install -r backend/requirements.txt
        
        # hdbscan 컴파일 시 발생하는 timeout 방지를 위해 빌드 의존성 먼저 설치
        pip install "cython<3.0.0" numpy
        
        # 바이너리 패널티를 우선 허용하여 hdbscan 빠른 설치 유도
        pip install --no-build-isolation hdbscan 
        
        # 임시로 스크립트에 필요한 필수 패키지 명시적 설치
        pip install requests beautifulsoup4 pandas sqlalchemy psycopg2-binary
        pip install python-dotenv pytz "google-generativeai" "bertopic" "scikit-learn" "konlpy" "langgraph" "langchain-core"
        
    - name: 파이프라인 실행 (크롤링 + 클러스터링)
      env:
        # GitHub Secrets에서 가져온 환경 변수
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        PYTHONPATH: .
      run: |
        python -m app.scroller.scroller_test.run_pipeline
